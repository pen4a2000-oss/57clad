const W=720,H=1280,c=document.getElementById('c'),x=c.getContext('2d',{willReadFrequently:true});
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const ei=t=>Math.pow(clamp(t),3);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const prog=(t,a,b)=>clamp((t-a)/(b-a));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const C={night:'#1b1830',night2:'#2a2347',gold:'#f2b632',yellow:'#ffd23f',red:'#e8343a',teal:'#2ec4b6',sand:'#d9a85b',sand2:'#c08a45',sand3:'#a26f35',skin:'#e0a77c',skin2:'#a8693f',white:'#f4efe6',linen:'#ece3cf',jeans:'#3a5ba8',hood:'#e8772e',stone:'#8a7a63',stone2:'#6b5d4b',dark:'#100e1c'};

function rect(c_,X,Y,w,h){x.fillStyle=c_;x.fillRect(X,Y,w,h)}
function circle(c_,X,Y,r){x.fillStyle=c_;x.beginPath();x.arc(X,Y,r,0,Math.PI*2);x.fill()}
function poly(c_,pts){x.fillStyle=c_;x.beginPath();x.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)x.lineTo(pts[i],pts[i+1]);x.closePath();x.fill()}
function grad(y0,y1,a,b){const g=x.createLinearGradient(0,y0,0,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g}

// ---------- blocky person, feet at (X,Y), s=scale (≈ 110px tall at s=1)
function person(X,Y,s,o={}){
  const sk=o.skin||C.skin, sh=o.shirt||C.hood, pa=o.pants||C.jeans, hr=o.hair||'#3b2618';
  const ph=o.phase||0, walk=o.walk||0, f=o.face===undefined?1:o.face;
  x.save();x.translate(X,Y);x.scale(s*f,s);
  if(o.rot){x.rotate(o.rot)}
  const sw=Math.sin(ph)*walk;
  // legs
  x.save();x.translate(-6,-40);x.rotate(sw*0.5);rect(pa,-5,0,10,40);rect('#222',-6,36,13,5);x.restore();
  x.save();x.translate(6,-40);x.rotate(-sw*0.5);rect(pa,-5,0,10,40);rect('#222',-6,36,13,5);x.restore();
  // back arm
  const armUp=o.armsUp||0;
  x.save();x.translate(9,-74);x.rotate(-sw*0.6-armUp*2.6);rect(o.sleeve||sh,-4,0,8,30);rect(sk,-4,28,8,6);x.restore();
  // body
  rect(sh,-13,-78,26,40);
  if(o.cloak){rect(o.cloak,-15,-80,30,58);}
  if(o.belt)rect(o.belt,-13,-44,26,5);
  if(o.pack){rect(o.pack,-22*1,-74,10,26);}
  // head
  const hx=o.headTurn||0;
  if(o.jackal){
    rect('#1d1a14',-11,-104,22,26);poly('#1d1a14',[-10,-104,-14,-122,-3,-104]);poly('#1d1a14',[3,-104,8,-122,11,-104]);
    poly('#1d1a14',[11,-96,26,-90,26,-84,11,-82]);rect(C.gold,-11,-82,22,4);circle(C.gold,6,-95,2);
  }else if(o.hoodHead){
    rect(sk,-9,-100,20,20);poly(o.hoodHead,[-13,-82,-13,-104,0,-112,13,-104,13,-82,10,-82,10,-100,-9,-100,-9,-82]);rect('#000',2,-96,6,3);
  }else{
    rect(sk,-10,-102,22,24);
    if(o.bald){}else if(o.nemes){poly(o.nemes,[-14,-78,-12,-104,12,-106,14,-78,10,-78,10,-100,-8,-100,-8,-78]);}
    else rect(hr,-11,-104,23,8),rect(hr,-11,-104,6,16);
    rect('#1a1410',6+hx,-94,3,4);
  }
  // front arm
  x.save();x.translate(-9,-74);x.rotate(sw*0.6-armUp*2.4+(o.armF||0));rect(o.sleeve||sh,-4,0,8,30);rect(sk,-4,28,8,6);if(o.spear){rect('#6b4a2b',-1,-60,3,130);poly('#bbb',[-4,-60,0.5,-76,5,-60]);}if(o.torch){rect('#6b4a2b',-2,20,4,26);flame(0,18,1+0.15*Math.sin(T*30));}x.restore();
  x.restore();
}
function flame(X,Y,s,lean=0){x.save();x.translate(X,Y);x.scale(s,s);x.rotate(lean);
  poly('#ff6b1a',[-7,0,0,-24,7,0]);poly('#ffd23f',[-4,0,0,-14,4,0]);x.restore();}

// ---------- crowd helper
function crowd(seed,n,y0,y1,s0,s1,opts={}){const r=rng(seed);const arr=[];for(let i=0;i<n;i++){arr.push({x:r()*W*1.3-W*0.15,y:lerp(y0,y1,r()),c:r(),d:r(),k:r()})}arr.sort((a,b)=>a.y-b.y);
  for(const p of arr){const s=lerp(s0,s1,(p.y-y0)/(y1-y0||1));const lin=['#ece3cf','#e6dcc4','#d9cdb1','#f2ece0'][Math.floor(p.c*4)];
    const sk=['#a8693f','#8d5530','#b77a4b','#7a4726'][Math.floor(p.d*4)];
    const mourn=opts.mourn&&p.k<0.4;
    person(p.x+(opts.dx||0)*s,p.y,s,{shirt:lin,pants:lin,skin:sk,hair:'#111',armsUp:mourn?0.6+0.25*Math.sin(T*6+p.c*9):0,walk:opts.walk?0.6:0,phase:T*7+p.c*6,face:p.k>0.5?1:-1,sleeve:sk,belt:p.k>0.8?C.gold:null});}
}

// ---------- backgrounds
function sky(top,bot){x.fillStyle=grad(0,H,top,bot);x.fillRect(0,0,W,H)}
function stars(seed,a=1){const r=rng(seed);x.globalAlpha=a;for(let i=0;i<120;i++){const tw=0.5+0.5*Math.sin(T*2+i);circle('#fff',r()*W,r()*H*0.6,r()*1.6+0.3*tw)}x.globalAlpha=1}
function desertBG(){sky('#f6b46b','#f9dca0');circle('#fff3d0',560,260,70);
  poly('#e3a961',[0,640,140,560,300,600,460,540,720,600,720,700,0,700]);
  poly('#c78a4a',[380,620,470,470,560,620]);poly('#b07840',[470,470,560,620,500,620]);
  poly('#c78a4a',[540,630,600,540,660,630]);
  rect(C.sand,0,640,W,H-640);}
function cliffs(col){poly(col,[0,700,0,420,90,380,160,440,230,360,330,420,420,340,520,410,620,360,720,420,720,700])}

// ---------- UI
function pill(X,Y,txt,bg='rgba(0,0,0,.55)',fg='#fff',dot){x.font='900 22px M';const w=x.measureText(txt).width+(dot?44:28);x.fillStyle=bg;rr(X,Y,w,40,20);x.fill();if(dot){circle(dot,X+20,Y+20,6)}x.fillStyle=fg;x.textBaseline='middle';x.fillText(txt,X+(dot?34:14),Y+21);return w}
function rr(X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function hud(t){
  if(t<11.8||t>=113.2)return;
  const blink=(Math.floor(t*2)%2)?C.red:'#7a1c1f';
  let label='1323 ДО Н.Э.';
  pill(24,28,label,'rgba(0,0,0,.55)','#fff',blink);
  let sub= t<26.6?'РЕКА НИЛ': t<60.6?'ФИВЫ · ПОХОРОНЫ':'ДОЛИНА ЦАРЕЙ';
  x.font='700 18px M';x.fillStyle='rgba(255,255,255,.75)';x.fillText(sub,30,86);
  if(t>=62.6&&t<99.4&&!(t>=67.6&&t<73.6)&&!(t>=80.4&&t<86.8)){const rem=Math.max(0,240*(1-prog(t,62.6,97.4)));const mm=Math.floor(rem/60),ss=Math.floor(rem%60);
    pill(24,108,`${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')} ДО ЗАПЕЧАТЫВАНИЯ`,'rgba(232,52,58,.9)','#fff');}
  // charge
  const txt=t<97.4?'ЗАРЯД 3%':'НЕТ СИГНАЛА';
  x.font='900 20px M';const w=x.measureText(txt).width+70;
  x.fillStyle='rgba(0,0,0,.55)';rr(W-24-w,28,w,40,20);x.fill();
  x.strokeStyle=t<97.4?C.teal:C.red;x.lineWidth=2;x.strokeRect(W-24-w+14,40,30,16);rect(t<97.4?C.teal:C.red,W-24-w+16,42,t<97.4?3:0,12);
  x.fillStyle=t<97.4?C.teal:C.red;x.textBaseline='middle';x.fillText(txt,W-24-w+52,49);
}

[24.8,26.6,'ТЫ ВЫПОЛЗАЕШЬ — И *ЗАМИРАЕШЬ.*'],[26.6,28.6,'НА БЕРЕГУ — *ТЫСЯЧИ ЛЮДЕЙ.*'],[28.6,30.6,'#ПОХОРОНЫ ФАРАОНА.#'],[30.6,32.4,'А ТЫ — *В ДЖИНСАХ.*'],[32.4,35.0,'И СТРАЖНИК СМОТРИТ #ПРЯМО НА ТЕБЯ.#'],

[67.6,70.0,'ПРАВИЛО ТРЕТЬЕ: *НЕ ВКЛЮЧАЙ СВЕТ.*'],[70.0,73.4,'СВЕТ ИЗ НИОТКУДА ЗДЕСЬ — ЭТО #ДЕМОН.#'],[73.6,75.6,'ТЫ ПРИОТКРЫВАЕШЬ КРЫШКУ...'],[75.6,78.4,'И НА ТЕБЯ СМОТРИТ #ЖРЕЦ В МАСКЕ ШАКАЛА!#'],
[78.6,80.2,'#ФАКЕЛ# ЛЕТИТ В ТЕБЯ.'],[80.4,82.6,'ПРАВИЛО ЧЕТВЁРТОЕ: *СМОТРИ НА ОГОНЬ.*'],[82.6,84.6,'ПЛАМЯ ТЯНЕТСЯ *К СКВОЗНЯКУ.*'],[84.6,86.6,'А СКВОЗНЯК — ЭТО #ВЫХОД.#'],
[86.8,88.6,'ТЫ *БЕЖИШЬ.*'],[88.6,90.4,'ПЛИТА УЖЕ #ПО ПОЯС.#'],[90.4,92.6,'НО МАШИНА *НЕ ПРОЛЕЗАЕТ.*'],[92.8,95.0,'#ОНА... ИЛИ ТЫ.#'],[95.2,97.4,'ТЫ БРОСАЕШЬ ЕЁ. И *НЫРЯЕШЬ.*'],
[99.4,101.4,'НОЧЬ. ЗВЁЗДЫ. *ТЫ ЖИВ.*'],[101.4,103.6,'А МАШИНА ВРЕМЕНИ — #ЗАМУРОВАНА.#'],[103.6,106.0,'НА ПЕЧАТИ ИМЯ: *ТУТАНХАМОН.*'],[106.0,109.6,'ЭТУ ДВЕРЬ ОТКРОЮТ ТОЛЬКО ЧЕРЕЗ *3200 ЛЕТ.*'],
[109.8,113.0,'А ЗА СПИНОЙ УЖЕ #СКРИПИТ ТЕТИВА.#']];
function tokens(s){const out=[];let mode='w';for(const w of s.split(' ')){let m=mode;let ww=w;
  if(ww.startsWith('*')){m='y';ww=ww.slice(1);mode='y'} if(ww.startsWith('#')){m='r';ww=ww.slice(1);mode='r'}
  let end=false;if(ww.endsWith('*')||ww.endsWith('#')){ww=ww.slice(0,-1);end=true}
  out.push([ww,m]);if(end)mode='w';}return out}
function captions(t){const cap=CAPS.find(c=>t>=c[0]&&t<c[1]);if(!cap)return;
  const lt=t-cap[0];const sc=lerp(0.85,1,eo(lt/0.15));
  const tk=tokens(cap[2]);x.font='900 50px M';const lines=[];let line=[],lw=0;const sp=x.measureText(' ').width;
  for(const [w,m] of tk){const ww=x.measureText(w).width;if(lw+ww>620&&line.length){lines.push([line,lw]);line=[];lw=0}line.push([w,m,ww]);lw+=ww+sp}
  if(line.length)lines.push([line,lw]);
  const base=1010-(lines.length-1)*30;
  x.save();x.translate(W/2,base);x.scale(sc,sc);x.textBaseline='middle';
  lines.forEach(([ln,lw],i)=>{let cx=-(lw-sp)/2;const y=i*60;for(const [w,m,ww] of ln){
    x.lineWidth=10;x.lineJoin='round';x.strokeStyle='rgba(10,8,20,.85)';x.strokeText(w,cx,y);
    x.fillStyle=m==='y'?C.yellow:m==='r'?C.red:'#fff';x.fillText(w,cx,y);cx+=ww+sp;}});
  x.restore();}

function ruleCard(n,title,p){ // top panel like reference
  const a=eo(p*6);x.save();x.globalAlpha=a;x.translate(0,(1-a)*-40);
  x.fillStyle='rgba(16,14,28,.94)';rr(40,130,640,150,18);x.fill();
  x.fillStyle=C.red;rr(40,130,640,52,18);x.fill();rect(C.red,40,160,640,22);
  x.font='900 26px M';x.fillStyle='#fff';x.textBaseline='middle';x.fillText('ПРАВИЛО '+n,64,157);
  x.font='900 40px M';x.textAlign='center';x.fillText(title,W/2,232);x.textAlign='left';x.restore();}
function panel(X,Y,w,h){x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=2;x.fillStyle='rgba(255,255,255,.03)';x.fillRect(X,Y,w,h);x.strokeRect(X,Y,w,h)}
function label(X,Y,txt,bg=C.yellow,fg='#111'){x.font='900 20px M';const w=x.measureText(txt).width+22;x.fillStyle=bg;rr(X-w/2,Y-16,w,32,16);x.fill();x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';x.fillText(txt,X,Y+1);x.textAlign='left'}
function bigText(txt,Y,size,col,a=1){x.save();x.globalAlpha=a;x.font=`900 ${size}px M`;x.textAlign='center';x.textBaseline='middle';x.lineWidth=12;x.strokeStyle='rgba(0,0,0,.6)';x.lineJoin='round';x.strokeText(txt,W/2,Y);x.fillStyle=col;x.fillText(txt,W/2,Y);x.restore()}

// ---------- machine prop
function machine(X,Y,s,glow=1){x.save();x.translate(X,Y);x.scale(s,s);
  rect('#4b4f5c',-40,-50,80,50);rect('#2f323b',-40,-8,80,8);rect('#0d2b2a',-30,-42,40,24);

  x.strokeStyle='#e8772e';x.lineWidth=3;x.beginPath();x.moveTo(-40,-20);x.bezierCurveTo(-60,-10,-55,10,-30,6);x.stroke();
  x.restore();}

let T=0, shake=0;
const S=[];
function sc(s,e,f){S.push({s,e,f})}

// S1 hook
sc(0,3,(t,p)=>{rect('#07060d',0,0,W,H);
  const g=0.5+0.5*Math.sin(t*20);machine(W/2,700,2.2,g);

// S2 garage
sc(3,10,(t,p)=>{rect('#1d1b2a',0,0,W,H);rect('#262338',0,0,W,700);
  // shelves, window
  rect('#151320',80,160,200,140);rect('#2c3a63',90,170,180,120);circle('#e8e4d0',220,210,18);

  rect('#121019',0,760,W,H-760);

  // lamp
  x.fillStyle='rgba(255,220,150,.12)';poly(x.fillStyle,[340,120,380,120,560,700,160,700]);rect('#999',355,0,6,120);poly('#555',[330,120,390,120,375,100,345,100]);
  const tt=t-3;

  // display close-up insert

function render(t){T=t;shake=0;x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.textAlign='left';
  const s=S.find(z=>t>=z.s&&t<z.e)||S[S.length-1];

  s.f(t,(t-s.s)/(s.e-s.s));
  x.restore();
  if(shake>0){const img=x.getImageData(0,0,W,H);const r=rng(Math.floor(t*60));x.fillStyle='#000';x.fillRect(0,0,W,H);x.putImageData(img,(r()-0.5)*shake*2,(r()-0.5)*shake*2)}

  const g=x.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.45)');x.fillStyle=g;x.fillRect(0,0,W,H);
  hud(t);captions(t);
}
