<script>

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;

const C={wall:'#1b2130',wall2:'#232b3d',floor:'#2a2420',door:'#5b3624',door2:'#4a2b1c',stud:'#c9a35a',red:'#e5383b',yellow:'#ffd23f',teal:'#3fd0c0',skin:'#e9b48e',skinS:'#c98f6a',hood:'#3b4a5e',paper:'#efe6cf',ink:'#2a2320'};

function rr(X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function grad(y0,y1,a,b){const g=x.createLinearGradient(0,y0,0,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g}

let T=0,shake=0,flick=1;

// ---------- FACE (close-up capable)
function face(cx,cy,R,o={}){
  const sk=o.skin||C.skin;
  x.save();x.translate(cx,cy);
  // neck + hoodie
  if(o.body!==false){rect(sk,-R*0.28,R*0.7,R*0.56,R*0.5);x.fillStyle=o.shirt||C.hood;rr(-R*1.15,R*1.05,R*2.3,R*1.6,R*0.5);x.fill();
    x.fillStyle='rgba(0,0,0,.25)';rr(-R*0.45,R*1.05,R*0.9,R*0.25,R*0.12);x.fill();}
  // ears
  ell(o.skinS||C.skinS,-R*0.92,R*0.05,R*0.16,R*0.24);ell(o.skinS||C.skinS,R*0.92,R*0.05,R*0.16,R*0.24);

  // hair
  if(o.hair!=='none'){const hc=o.hairC||'#2b1d16';
    if(o.hair==='bun'){ell(hc,0,-R*0.55,R*0.92,R*0.55);circle(hc,0,-R*1.15,R*0.32);}
    else if(o.hair==='scarf'){x.fillStyle=o.hairC||'#7d2e2e';x.beginPath();x.ellipse(0,-R*0.2,R*1.05,R*1.0,0,Math.PI*0.95,Math.PI*2.05);x.fill();poly(o.hairC||'#7d2e2e',[-R*0.9,R*0.2,-R*1.05,R*0.9,-R*0.6,R*0.6]);poly(o.hairC||'#7d2e2e',[R*0.9,R*0.2,R*1.05,R*0.9,R*0.6,R*0.6]);}
    else{x.fillStyle=hc;x.beginPath();x.ellipse(0,-R*0.45,R*0.95,R*0.62,0,Math.PI,Math.PI*2);x.fill();
      poly(hc,[-R*0.95,-R*0.45,-R*0.6,-R*0.05,-R*0.35,-R*0.5,0,-R*0.15,R*0.25,-R*0.5,R*0.6,-R*0.1,R*0.95,-R*0.45]);}}
  // eyes
  const wide=o.wide||1, lx=(o.look?o.look[0]:0)*R*0.08, ly=(o.look?o.look[1]:0)*R*0.06;
  const blink=o.blink?0.12:1;
  for(const sx of [-1,1]){const ex=sx*R*0.36,ey=-R*0.05;
    ell('#fbf7f0',ex,ey,R*0.2,R*0.15*wide*blink);
    if(blink>0.5){circle(o.pupil||'#1f1a17',ex+lx,ey+ly,R*0.09*(o.small?0.6:1));circle('#fff',ex+lx+R*0.03,ey+ly-R*0.03,R*0.025);}
    x.strokeStyle='rgba(40,25,20,.6)';x.lineWidth=R*0.03;x.beginPath();x.ellipse(ex,ey,R*0.2,R*0.15*wide*blink,0,Math.PI*1.05,Math.PI*1.95);x.stroke();
    // brows
    const fear=o.fear||0;x.strokeStyle=o.hairC||'#2b1d16';x.lineWidth=R*0.07;x.lineCap='round';x.beginPath();
    x.moveTo(ex-sx*R*0.17,ey-R*0.27-fear*R*0.02);x.lineTo(ex+sx*R*0.17,ey-R*0.27+fear*R*0.1*(-1)+ (o.angry?R*0.1:0));x.stroke();
    if(fear>0){x.beginPath();x.moveTo(ex-sx*R*0.17,ey-R*0.27);x.quadraticCurveTo(ex,ey-R*0.36-fear*R*0.05,ex+sx*R*0.18,ey-R*0.22);x.stroke();}
    if(o.bags){x.strokeStyle='rgba(90,50,60,.5)';x.lineWidth=R*0.025;x.beginPath();x.arc(ex,ey+R*0.12,R*0.15,0.2*Math.PI,0.8*Math.PI);x.stroke();}
  }

  x.strokeStyle=o.skinS||C.skinS;x.lineWidth=R*0.05;x.beginPath();x.moveTo(0,R*0.0);x.quadraticCurveTo(R*0.1,R*0.25,-R*0.05,R*0.3);x.stroke();

  else{x.strokeStyle='#7a3a32';x.lineWidth=R*0.05;x.beginPath();x.moveTo(-R*0.15,R*0.55);x.quadraticCurveTo(0,R*0.5,R*0.15,R*0.57);x.stroke();}

  x.restore();
  x.restore();
}
function thingFace(X,Y,R,a=1){x.save();x.globalAlpha=a;x.translate(X,Y);x.rotate(0.12);

  x.fillStyle='#16161b';x.beginPath();x.ellipse(0,-R*0.1,R*0.95,R*1.15,0,0,6.28);x.fill();x.fillRect(-R*0.95,0,R*1.9,R*2.2);

  for(const sx of [-1,1]){ell('#050506',sx*R*0.27,-R*0.1,R*0.16,R*0.3,sx*-0.12);
    x.fillStyle='#050506';x.fillRect(sx*R*0.27-R*0.025,R*0.12,R*0.05,R*0.32);circle('#050506',sx*R*0.27,R*0.44,R*0.04);
    circle('#ff2a2a',sx*R*0.27,-R*0.05,R*0.03);}
  x.fillStyle='#050506';x.beginPath();x.moveTo(-R*0.55,R*0.42);x.quadraticCurveTo(0,R*0.68,R*0.55,R*0.42);x.quadraticCurveTo(0,R*0.56,-R*0.55,R*0.42);x.fill();
  x.strokeStyle='rgba(60,50,50,.6)';x.lineWidth=R*0.02;x.beginPath();x.moveTo(R*0.2,-R*0.95);x.lineTo(R*0.1,-R*0.6);x.lineTo(R*0.22,-R*0.45);x.stroke();
  // hair strands over face
  x.strokeStyle='#16161b';x.lineWidth=R*0.07;x.lineCap='round';
  for(const [x0,x1] of [[-0.55,-0.45],[-0.35,-0.5],[0.45,0.5],[0.6,0.42]]){x.beginPath();x.moveTo(x0*R,-R*0.95);x.quadraticCurveTo((x0+x1)/2*R,0,x1*R,R*1.0);x.stroke()}

function thing(X,Y,s,a=1){x.save();x.globalAlpha=a;x.translate(X,Y);x.scale(s,s);
  x.fillStyle='#0b0b0e';rr(-24,-330,48,240,20);x.fill();rect('#0b0b0e',-18,-100,13,100);rect('#0b0b0e',6,-100,13,100);
  x.save();x.translate(-22,-318);x.rotate(0.06);rr(-8,0,11,250,5);x.fill();x.restore();x.save();x.translate(22,-318);x.rotate(-0.06);rr(-3,0,11,250,5);x.fill();x.restore();
  ell('#d8d4cb',-23,-66,6,9);ell('#d8d4cb',27,-66,6,9);
  x.restore();thingFace(X,Y-370*s,30*s,a);}
// ---------- props
function paddedDoor(X,Y,w,h,o={}){ // front door, Russian padded style
  x.save();x.translate(X,Y);
  rect('#120f0c',-14,-14,w+28,h+14);
  rect(C.door,0,0,w,h);
  x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=2;
  for(let i=1;i<6;i++){x.beginPath();x.moveTo(0,h*i/6);x.lineTo(w,h*i/6-0);x.stroke()}
  for(let r=0;r<7;r++)for(let k=0;k<4;k++){const sx=w*(k+0.5)/4+((r%2)?w/8:0),sy=h*(r+0.5)/7;if(sx<w-6)circle(C.stud,sx,sy,3.2)}
  // lock, handle, chain
  rect('#b9a46a',w-46,h*0.48,26,10);circle('#888',w-30,h*0.43,7);circle('#111',w-30,h*0.43,3);
  rect('#999',w-60,h*0.36,30,6);
  const sw=o.chain||0;x.strokeStyle='#cfcfcf';x.lineWidth=3;x.beginPath();x.moveTo(w-58,h*0.36+3);
  for(let i=1;i<=10;i++){const tt=i/10;x.lineTo(w-58+tt*-0+Math.sin(T*40)*sw*4*Math.sin(tt*Math.PI),h*0.36+3+Math.sin(tt*Math.PI)*28+tt*0)}x.stroke();
  rect('#999',w+2,h*0.36,14,10);
  // peephole
  circle('#0c0c0c',w/2,h*0.28,8);circle(o.peep||'#3a3a3a',w/2,h*0.28,4);
  x.restore();}
function underDoorLight(X,Y,w,col,feet){x.fillStyle=col;x.fillRect(X,Y,w,6);if(feet){x.fillStyle='rgba(0,0,0,.9)';x.fillRect(X+w*0.3,Y,w*0.12,6);x.fillRect(X+w*0.55,Y,w*0.12,6)}
  const g=x.createLinearGradient(0,Y,0,Y+120);g.addColorStop(0,col.replace(/,[\d.]+\)$/,',.35)'));g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(X-40,Y+6,w+80,120)}
function wallClock(X,Y,R,hm,sec){circle('#ddd6c6',X,Y,R);x.strokeStyle='#222';x.lineWidth=4;x.beginPath();x.arc(X,Y,R,0,6.28);x.stroke();
  for(let i=0;i<12;i++){const a=i/12*6.28;rect('#222',X+Math.cos(a)*R*0.82-2,Y+Math.sin(a)*R*0.82-2,4,4)}
  const [h,m]=hm;const ah=((h%12)+m/60)/12*6.28-Math.PI/2,am=m/60*6.28-Math.PI/2,as=sec/60*6.28-Math.PI/2;
  x.lineCap='round';x.strokeStyle='#222';x.lineWidth=6;x.beginPath();x.moveTo(X,Y);x.lineTo(X+Math.cos(ah)*R*0.5,Y+Math.sin(ah)*R*0.5);x.stroke();
  x.lineWidth=4;x.beginPath();x.moveTo(X,Y);x.lineTo(X+Math.cos(am)*R*0.75,Y+Math.sin(am)*R*0.75);x.stroke();
  x.strokeStyle=C.red;x.lineWidth=2;x.beginPath();x.moveTo(X,Y);x.lineTo(X+Math.cos(as)*R*0.8,Y+Math.sin(as)*R*0.8);x.stroke();circle('#222',X,Y,5);}
function bubble(X,Y,txt,o={}){x.font=`900 ${o.size||30}px M`;const lines=txt.split('\n');const w=Math.max(...lines.map(l=>x.measureText(l).width))+44,h=lines.length*(o.size||30)*1.25+30;
  x.save();x.translate(X,Y);const jag=o.jag;x.fillStyle=o.bg||'#f4efe6';
  if(jag){x.beginPath();const n=18;for(let i=0;i<n;i++){const a=i/n*6.28,r=(i%2?1:1.12);x.lineTo(Math.cos(a)*w*0.55*r,Math.sin(a)*h*0.62*r)}x.closePath();x.fill();}
  else{rr(-w/2,-h/2,w,h,20);x.fill();poly(o.bg||'#f4efe6',[-12,h/2-2,12,h/2-2,(o.tail||0),h/2+26]);}
  x.fillStyle=o.fg||'#141414';x.textAlign='center';x.textBaseline='middle';lines.forEach((l,i)=>x.fillText(l,0,(i-(lines.length-1)/2)*(o.size||30)*1.25));x.restore();x.textAlign='left';}
function label(X,Y,txt,bg=C.yellow,fg='#111',size=22){x.font=`900 ${size}px M`;const w=x.measureText(txt).width+24;x.fillStyle=bg;rr(X-w/2,Y-size*0.8,w,size*1.6,size*0.8);x.fill();x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';x.fillText(txt,X,Y+1);x.textAlign='left'}
function bigText(txt,Y,size,col,a=1,X=W/2){x.save();x.globalAlpha=a;x.font=`900 ${size}px M`;x.textAlign='center';x.textBaseline='middle';x.lineWidth=14;x.strokeStyle='rgba(0,0,0,.75)';x.lineJoin='round';x.strokeText(txt,X,Y);x.fillStyle=col;x.fillText(txt,X,Y);x.restore()}
function hallBG(lit=1){x.fillStyle=grad(0,H,'#151a26','#0c0f16');x.fillRect(0,0,W,H);
  // wallpaper stripes
  x.fillStyle='rgba(255,255,255,.025)';for(let i=0;i<W;i+=48)x.fillRect(i,0,20,900);
  rect('#1d1813',0,900,W,H-900);x.fillStyle='rgba(255,255,255,.03)';for(let i=0;i<8;i++)x.fillRect(0,900+i*50,W,2);
  rect('#2a221b',0,890,W,14);}
function kitchenBG(){x.fillStyle=grad(0,H,'#1a2230','#0e121a');x.fillRect(0,0,W,H);
  // tiles
  x.strokeStyle='rgba(255,255,255,.04)';x.lineWidth=2;for(let i=0;i<W;i+=60){x.beginPath();x.moveTo(i,420);x.lineTo(i,760);x.stroke()}for(let j=420;j<760;j+=60){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}

// ---------- HUD + captions
function pill(X,Y,txt,bg,fg,dot,size=20){x.font=`900 ${size}px M`;const w=x.measureText(txt).width+(dot?44:26);x.fillStyle=bg;rr(X,Y,w,size*1.9,size*0.95);x.fill();if(dot)circle(dot,X+20,Y+size*0.95,6);x.fillStyle=fg;x.textBaseline='middle';x.textAlign='left';x.fillText(txt,X+(dot?34:13),Y+size*0.98);return w}
function remaining(t){const K=TM.timerKeys;if(t<K[0][0])return null;for(let i=1;i<K.length;i++){if(t<K[i][0]){const [a,va]=K[i-1],[b,vb]=K[i];return lerp(va,vb,(t-a)/(b-a))}}return 0}
function hud(t){if(t>=TM.endCard)return;
  const blink=(Math.floor(t*2)%2)?C.red:'#7a1c1f';
  pill(22,26,'КВАРТИРА 47','rgba(0,0,0,.6)','#fff',blink);
  pill(22,70,'ПРАВИЛО 1/7','rgba(229,56,59,.9)','#fff',null,16);
  const rem=remaining(t);let txt,bg='rgba(0,0,0,.6)',fg='#fff';
  if(rem===null){txt=t<LN[1][0]?'03:00':t<LN[5][0]?'21:04':'02:59'; if(t<LN[1][0])fg=C.red;}
  else{const s=Math.ceil(rem);txt='ОСТАЛОСЬ 00:'+String(Math.max(0,s)).padStart(2,'0');bg='rgba(229,56,59,.92)';}
  x.font='900 22px M';const w=x.measureText(txt).width+28;x.fillStyle=bg;rr(W-22-w,26,w,42,21);x.fill();x.fillStyle=fg;x.textBaseline='middle';x.fillText(txt,W-22-w+14,48);
}
function tokenize(s){const out=[];let mode='w';for(const w0 of s.split(' ')){let w=w0,m=mode;if(w.startsWith('*')){m='y';w=w.slice(1);mode='y'}if(w.startsWith('#')){m='r';w=w.slice(1);mode='r'}let end=false;if(w.endsWith('*')||w.endsWith('#')||/[*#][».,?!:…]*$/.test(w)){const mm=w.match(/[*#]/);if(mm){w=w.replace(/[*#]/,'');end=true}}out.push([w,m]);if(end)mode='w'}return out}
const CAP=__CAPS__;
let CHUNKS=[];
