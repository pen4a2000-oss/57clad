<script>
const W=720,H=1280,c=document.getElementById('c'),X0=c.getContext('2d',{willReadFrequently:true});
const TM=__TIMING__, WORDS=__WORDS__;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), prog=(t,a,b)=>clamp((t-a)/(b-a));
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}, eo=t=>1-Math.pow(1-clamp(t),3);
const back=t=>{t=clamp(t);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
let x=X0, T=0;
function layer(){const cv=document.createElement('canvas');cv.width=1080;cv.height=1920;const g=cv.getContext('2d');g.setTransform(1.5,0,0,1.5,0,0);return [cv,g]}
function poly(c_,p){x.fillStyle=c_;x.beginPath();x.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)x.lineTo(p[i],p[i+1]);x.closePath();x.fill()}
function rr(X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function ell(c_,X,Y,rx,ry,rot=0){x.fillStyle=c_;x.beginPath();x.ellipse(X,Y,rx,ry,rot,0,Math.PI*2);x.fill()}
function lg(x0,y0,x1,y1,st){const g=x.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,c_])=>g.addColorStop(o,c_));return g}
function rg(X,Y,r0,r1,a,b){const g=x.createRadialGradient(X,Y,r0,X,Y,r1);g.addColorStop(0,a);g.addColorStop(1,b);return g}
function txt(s,X,Y,size,col,align='center',w=900){x.font=`${w} ${size}px M`;x.fillStyle=col;x.textAlign=align;x.textBaseline='middle';x.fillText(s,X,Y);x.textAlign='left'}
const INK='#231a14';
__LIB__
// ---------- cached layers
function bgMarket(night){const [cv,g]=layer();const sv=x;x=g;
  x.fillStyle=night?lg(0,0,0,760,[[0,'#0d1030'],[0.6,'#24264f'],[1,'#3b3260']]):lg(0,0,0,760,[[0,'#2b2a4a'],[0.55,'#7a4a5a'],[1,'#e39a5e']]);x.fillRect(0,0,W,1280);
  const r=rng(3);const cols=['#c98a5e','#e0b77a','#7fa7a0','#a48bb3','#d9967f','#8fb0c9'];
  for(let i=0;i<10;i++){const bx=i*86-60,bw=90,bh=180+r()*170,by=640-bh;x.fillStyle=cols[i%6];x.fillRect(bx,by,bw,bh);x.fillStyle='rgba(0,0,0,.2)';x.fillRect(bx+bw-18,by,18,bh);

  for(const [y0,sag] of [[250,60],[360,40]]){x.strokeStyle='#1a1410';x.lineWidth=2;x.beginPath();x.moveTo(-20,y0);x.quadraticCurveTo(360,y0+sag*2,740,y0);x.stroke();
    for(let i=1;i<14;i++){const t=i/14,bx=lerp(-20,740,t),by=y0+4*sag*t*(1-t);x.fillStyle=rg(bx,by+6,1,30,'rgba(255,220,150,.9)','rgba(255,220,150,0)');x.fillRect(bx-30,by-24,60,60);ell('#fff2c4',bx,by+6,4,5)}}

function groundLayer(night){const [cv,g]=layer();const sv=x;x=g;const VX=360,VY=640;
  x.fillStyle=lg(0,VY,0,H,[[0,'#7c5a44'],[1,'#a77b55']]);x.fillRect(-200,VY,W+400,H-VY+200);
  for(let row=0;row<30;row++){const t=Math.pow(row/30,1.5);const y=lerp(VY+4,H+60,t);const h=lerp(4,46,t);const n=Math.round(lerp(14,9,t));const half=lerp(420,900,t);
    for(let i=0;i<n;i++){const off=(row%2)*0.5;const xa=VX-half+(i+off)/n*half*2;const w=half*2/n*0.9;const sh=(i*7+row*3)%5;x.fillStyle=['#b58a62','#a57b55','#c2976c','#9c7350','#b08560'][sh];rr(xa,y,w,h*0.82,Math.min(10,h*0.35));x.fill();x.fillStyle='rgba(255,230,190,.12)';rr(xa+2,y+1,w-4,h*0.25,Math.min(6,h*0.2));x.fill()}}

// camera: world drawn with zoom around (cx,cy)
function cam(cx,cy,z,parallax=0.4,bg='day'){z=Math.max(1,z);cx=clamp(cx,360/z,720-360/z);cy=clamp(cy,640/z,1280-640/z);X0.setTransform(1,0,0,1,0,0);X0.fillStyle='#000';X0.fillRect(0,0,1080,1920);

  X0.setTransform(1.5*z,0,0,1.5*z,(360-cx*z)*1.5,(640-cy*z)*1.5);

const blinkMood=(base,k=0)=>((T*0.7+k)%3.2<0.12)?'bored':base;

  const rs=rng(4);for(let i=0;i<14;i++)ell('#1e130c',(rs()-0.5)*r*1.4,(rs()-0.5)*r*0.5,2.5,4,rs());x.restore()}

  for(let i=0;i<8;i++){x.fillStyle='rgba(35,26,20,.35)';x.fillRect(40,-170+i*28,190,8)}
  x.fillStyle=INK;x.fillRect(-240,80,480,3);txt('…а сосед — неудачник',-70,120,22,INK,'center',700);x.fillStyle='#d8cfb9';x.fillRect(110,95,120,120);
  x.save();x.beginPath();x.rect(110,95,120,120);x.clip();toon(170,290,0.55,{torso:'#6b8f71',apron:'#efe6d2',hair:'cap',capC:'#8c2f2f',mood:'bored'});x.restore();

function chalk(){x.save();x.translate(360,500);x.fillStyle='#5e3d22';rr(-290,-250,580,460,14);x.fill();x.fillStyle='#24312a';rr(-270,-230,540,420,8);x.fill();x.restore()}
function chalkText(s,X,Y,size,col='#f2efe6'){x.font=`900 ${size}px M`;x.fillStyle=col;x.textAlign='center';x.textBaseline='middle';x.globalAlpha=0.92;x.fillText(s,X,Y);x.globalAlpha=1;x.textAlign='left'}
function arrow(x0,y0,x1,y1,p,col='#f2efe6'){const xe=lerp(x0,x1,p),ye=lerp(y0,y1,p);x.strokeStyle=col;x.lineWidth=5;x.beginPath();x.moveTo(x0,y0);x.lineTo(xe,ye);x.stroke();if(p>0.95){const a=Math.atan2(y1-y0,x1-x0);x.beginPath();x.moveTo(x1,y1);x.lineTo(x1-16*Math.cos(a-0.5),y1-16*Math.sin(a-0.5));x.moveTo(x1,y1);x.lineTo(x1-16*Math.cos(a+0.5),y1-16*Math.sin(a+0.5));x.stroke()}}
function cupS(X,Y,s,hl){x.save();x.translate(X,Y);x.scale(s,s);poly('#fdf8ef',[-30,-90,30,-90,22,0,-22,0]);x.strokeStyle=INK;x.lineWidth=3;x.beginPath();x.moveTo(-30,-90);x.lineTo(30,-90);x.lineTo(22,0);x.lineTo(-22,0);x.closePath();x.stroke();rr(-34,-104,68,16,6);x.fillStyle='#6b4226';x.fill();x.stroke();x.fillStyle='#c98b4a';x.fillRect(-26,-60,52,20);
  if(hl){x.strokeStyle='#ffd36b';x.lineWidth=5;rr(-48,-122,96,136,16);x.stroke()}x.restore()}
// ---------- market scene drawn in world coords

  stall3d(180,900,0.88,'#b8433a',o.gp||'100 ₽','за штуку',false,'back');stall3d(540,900,0.88,'#2f7a52','300 ₽','ОТБОРНЫЕ',true,'back');

  toon(468,840+bob(2),0.85,Object.assign({torso:'#2f4a6e',apron:'#efe6d2',hair:'side',hairC:'#7a3f1f',mood:blinkMood('smug'),bow:true,armR:[52,-110]},ark));
  stall3d(180,900,0.88,'#b8433a',o.gp||'100 ₽',o.gp?'СКИДКА!':'за штуку',false,'front');stall3d(540,900,0.88,'#2f7a52','300 ₽','ОТБОРНЫЕ',true,'front');

    if(o.more){const m2=[[640,1230,1.18,'#7a4a6a','bun','#2b2018','calm'],[480,1270,1.24,'#4a6a8a','spiky','#3a2a1a','happy']];q.push(...m2.slice(0,o.more))}
    q.forEach(([X,Y,s,tc,hr,hc,md],i)=>toon(X+(o.shuffle?Math.sin(T*3+i)*3:0),Y+bob(i+3),s,{torso:tc,hair:hr,hairC:hc,capC:hc,mood:blinkMood(md,i),look:-1}))}
}
function dust(){screenSpace();const rr2=rng(11);for(let i=0;i<46;i++){const px=(rr2()*W+T*6*(0.5+rr2()))%W,py=(rr2()*H*0.85+Math.sin(T*0.6+i)*10),rad=1+rr2()*3;x.fillStyle=`rgba(255,226,170,${0.2+rr2()*0.45})`;x.beginPath();x.arc(px,py,rad,0,Math.PI*2);x.fill()}}

const SC=[];function sc(id,f){SC.push({id,f})}
sc('hook',(t)=>{const q=eio(prog(t,0,E('hook')));cam(360,lerp(640,700,q),lerp(1.0,1.12,q));market({shuffle:true});dust();grade();screenSpace();

  x.fillStyle=rg(360,500,60,700,'rgba(0,0,0,0)','rgba(0,0,0,.6)');x.fillRect(0,0,W,H)});

const CAPW=[];(function(){const ws=WORDS.map(w=>({t:w.text.replace(/[«».,:;!?—"]/g,'').toUpperCase(),s:w.start,e:w.end})).filter(w=>w.t);
  for(let i=0;i<ws.length;i++){let w=ws[i];if(w.t.length<=2&&i+1<ws.length&&ws[i+1].s-w.e<0.25){CAPW.push({t:w.t+' '+ws[i+1].t,s:w.s,e:ws[i+1].e});i++}else CAPW.push({t:w.t,s:w.s,e:w.e})}
  for(let i=0;i<CAPW.length;i++){const nx=CAPW[i+1];CAPW[i].e=nx?Math.min(nx.s,CAPW[i].e+0.35):CAPW[i].e+0.3}})();
function caption(t){const c_=CAPW.find(w=>t>=w.s&&t<w.e);if(!c_)return;screenSpace();const k=lerp(0.85,1,eo((t-c_.s)/0.08));
  x.save();x.translate(W/2,890);x.scale(k,k);x.font='900 64px M';let size=64;while(x.measureText(c_.t).width>640){size-=2;x.font=`900 ${size}px M`}x.textAlign='center';x.textBaseline='middle';
  x.shadowColor='rgba(0,0,0,.9)';x.shadowBlur=14;x.shadowOffsetY=4;x.fillStyle='#fff';x.fillText(c_.t,0,0);x.restore();x.shadowBlur=0;x.shadowOffsetY=0}
function render(t){T=t;x=X0;const order=TM.lines.map(l=>l.id);let id='tail';for(let i=0;i<order.length;i++){const nx=TM.lines[i+1];if(t<(nx?nx.s:E(order[i])+0.4)){id=order[i];break}}
  const s=SC.find(z=>z.id===id)||SC.find(z=>z.id==='tail');x.save();s.f(t);x.restore();x=X0;caption(t)}
