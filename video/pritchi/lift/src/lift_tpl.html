const W=720,H=1280,c=document.getElementById('c'),X0=c.getContext('2d',{willReadFrequently:true});
const TM=__TIMING__, WORDS=__WORDS__;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function layer(){const cv=document.createElement('canvas');cv.width=1080;cv.height=1920;const g=cv.getContext('2d');g.setTransform(1.5,0,0,1.5,0,0);return [cv,g]}

function ell(c_,X,Y,rx,ry,rot=0){x.fillStyle=c_;x.beginPath();x.ellipse(X,Y,rx,ry,rot,0,Math.PI*2);x.fill()}

function rg(X,Y,r0,r1,a,b){const g=x.createRadialGradient(X,Y,r0,X,Y,r1);g.addColorStop(0,a);g.addColorStop(1,b);return g}

function bgMarket(night){const [cv,g]=layer();const sv=x;x=g;
  x.fillStyle=night?lg(0,0,0,760,[[0,'#0d1030'],[0.6,'#24264f'],[1,'#3b3260']]):lg(0,0,0,760,[[0,'#2b2a4a'],[0.55,'#7a4a5a'],[1,'#e39a5e']]);x.fillRect(0,0,W,1280);
  const r=rng(3);const cols=['#c98a5e','#e0b77a','#7fa7a0','#a48bb3','#d9967f','#8fb0c9'];

// camera: world drawn with zoom around (cx,cy)
function cam(cx,cy,z,parallax=0.4,bg='day'){z=Math.max(1,z);cx=clamp(cx,360/z,720-360/z);cy=clamp(cy,640/z,1280-640/z);X0.setTransform(1,0,0,1,0,0);X0.fillStyle='#000';X0.fillRect(0,0,1080,1920);

  X0.save();X0.translate(540,960);X0.scale(zb*1.02,zb*1.02);X0.translate(-540+bx/zb,-960+by/zb);X0.drawImage(bg==='night'?BG.night:BG.day,0,0);X0.restore();
